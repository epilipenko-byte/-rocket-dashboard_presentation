<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROCKET — Финансовый дашборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --accent:   #22d3ee;
  --green:    #34d399;
  --red:      #f87171;
  --purple:   #a78bfa;
  --orange:   #fb923c;
  --yellow:   #fbbf24;
  --bg:       #050f05;
  --surface:  rgba(255,255,255,0.06);
  --card:     rgba(255,255,255,0.22);
  --border:   rgba(255,255,255,0.12);
  --text:     rgba(255,255,255,0.92);
  --muted:    rgba(255,255,255,0.5);
  --dim:      rgba(255,255,255,0.3);
  --font:     'Outfit', sans-serif;
  --mono:     'JetBrains Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow-x: hidden;
}

/* ── GRASS BACKGROUND ── */
#grassFrame {
  position: fixed; inset: 0; z-index: 0;
  border: none; width: 100%; height: 100%;
  pointer-events: none;
}
#vignette {
  position: fixed; inset: 0; z-index: 1;
  background: radial-gradient(
    ellipse 70% 70% at 50% 50%,
    rgba(5,15,5,0.82) 30%,
    rgba(5,15,5,0.55) 60%,
    rgba(5,15,5,0.1) 100%
  );
  pointer-events: none;
}

/* ── PASSWORD GATE ── */
#gate {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: rgba(5,15,5,0.96);
  backdrop-filter: blur(12px);
}
.gate-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 48px 56px;
  text-align: center;
  max-width: 400px; width: 90%;
  backdrop-filter: blur(20px);
}
.gate-logo {
  font-size: 36px; font-weight: 800; letter-spacing: 2px; margin-bottom: 6px;
}
.gate-logo span { color: var(--red); }
.gate-sub { color: var(--muted); font-size: 13px; margin-bottom: 32px; }
.gate-input {
  width: 100%;
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 16px;
  letter-spacing: 4px;
  outline: none;
  transition: border-color .2s;
  text-align: center;
}
.gate-input:focus { border-color: var(--accent); }
.gate-btn {
  margin-top: 16px; width: 100%;
  background: var(--accent); color: #050f05;
  border: none; border-radius: 10px;
  padding: 14px; font-family: var(--font);
  font-size: 15px; font-weight: 700;
  cursor: pointer; transition: opacity .2s;
}
.gate-btn:hover { opacity: .85; }
.gate-error { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 18px; }

/* ── MAIN APP ── */
#app {
  position: relative; z-index: 2;
  min-height: 100vh;
  display: none;
}

/* ── HEADER ── */
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(5,15,5,0.72);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap;
}
.logo-text {
  font-size: 22px; font-weight: 800; letter-spacing: 2px; white-space: nowrap;
}
.logo-text .r { color: var(--red); }
.logo-text .s { color: rgba(255,255,255,.4); font-size: 15px; font-weight: 500; margin-left: 8px; }

.period-group {
  display: flex; align-items: center; gap: 8px; margin-left: auto;
  flex-wrap: wrap;
}
.period-label { font-size: 11px; text-transform: uppercase; color: var(--muted); }
.period-select {
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  padding: 6px 12px;
  cursor: pointer; outline: none;
}
.period-select:focus { border-color: var(--accent); }

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  padding: 7px 16px; border-radius: 8px;
  font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; border: 1px solid; transition: all .2s;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #050f05; border-color: var(--accent); }
.btn-primary:hover { opacity: .85; }
.btn-secondary { background: transparent; color: var(--accent); border-color: var(--accent); }
.btn-secondary:hover { background: rgba(34,211,238,0.1); }
.btn-outline { background: transparent; color: var(--muted); border-color: var(--border); }
.btn-outline:hover { border-color: var(--muted); color: var(--text); }
.btn-export { position: relative; }
.export-menu {
  display: none; position: absolute; top: calc(100% + 6px); right: 0;
  background: rgba(10,25,10,0.95); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; min-width: 160px; z-index: 200;
  backdrop-filter: blur(20px);
}
.export-menu.open { display: block; }
.export-item {
  padding: 10px 16px; cursor: pointer; font-size: 13px; font-weight: 500;
  transition: background .15s;
}
.export-item:hover { background: rgba(255,255,255,0.06); }

.update-status {
  font-size: 11px; color: var(--muted); white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
}
.status-dot.loading { background: var(--yellow); animation: pulse 1s infinite; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── NAVIGATION TABS ── */
nav.tabs {
  position: sticky; top: 57px; z-index: 40;
  background: rgba(5,15,5,0.80);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex; gap: 2px; overflow-x: auto;
  scrollbar-width: none;
}
nav.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 12px 16px;
  font-family: var(--font); font-size: 13px; font-weight: 600;
  color: var(--muted); background: none; border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer; white-space: nowrap;
  transition: color .2s, border-color .2s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── CONTENT PANELS ── */
.panel { display: none; padding: 24px 20px; }
.panel.active { display: block; }

/* ── SECTION HEADING ── */
.section-h {
  font-size: 11px; text-transform: uppercase; color: var(--muted);
  letter-spacing: 1.5px; margin-bottom: 16px; margin-top: 24px;
}
.section-h:first-child { margin-top: 0; }

/* ── KPI CARDS ── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.kpi-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 16px 18px;
  backdrop-filter: blur(20px);
  transition: border-color .2s;
}
.kpi-card:hover { border-color: rgba(255,255,255,0.2); }
.kpi-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--muted); margin-bottom: 8px;
}
.kpi-value {
  font-family: var(--mono); font-size: 22px; font-weight: 700;
  line-height: 1; margin-bottom: 6px;
}
.kpi-delta {
  font-size: 11px; font-family: var(--mono);
  display: flex; align-items: center; gap: 4px;
}
.delta-pos { color: var(--green); }
.delta-neg { color: var(--red); }
.delta-neu { color: var(--muted); }

/* ── CHART GRID ── */
.chart-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px; margin-bottom: 24px;
}
.chart-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 20px;
  backdrop-filter: blur(20px);
  position: relative;
}
.chart-card.wide { grid-column: 1 / -1; }
.chart-title {
  font-size: 13px; font-weight: 600; color: var(--text);
  margin-bottom: 16px;
}
.chart-wrap { position: relative; height: 220px; }
.chart-wrap.tall { height: 300px; }
.chart-wrap.short { height: 160px; }

/* ── TABLE ── */
.data-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
.data-table th {
  font-size: 10px; text-transform: uppercase; color: var(--muted);
  font-weight: 600; padding: 8px 10px; text-align: right;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
.data-table th:first-child { text-align: left; }
.data-table td {
  padding: 7px 10px; text-align: right;
  font-family: var(--mono); font-size: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.data-table td:first-child {
  text-align: left; font-family: var(--font);
  font-size: 12px; color: var(--text);
}
.data-table tr:hover td { background: rgba(255,255,255,0.03); }
.data-table .section-row td {
  background: rgba(255,255,255,0.04);
  font-weight: 700; color: var(--accent);
  font-family: var(--font); font-size: 11px;
  text-transform: uppercase; letter-spacing: .8px;
}
.data-table .total-row td {
  font-weight: 700; border-top: 1px solid var(--border);
  color: var(--text);
}
.pos { color: var(--green); }
.neg { color: var(--red); }
.muted-val { color: var(--muted); }

/* ── THRESHOLD ALERT ── */
.alert-row { background: rgba(248,113,113,0.06) !important; }
.alert-row td:first-child::before {
  content: '⚠ ';
  color: var(--red);
}

/* ── AI ANALYSIS ── */
.ai-section { margin-bottom: 24px; }
.ai-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 24px;
  backdrop-filter: blur(20px);
}
.ai-card-title {
  font-size: 14px; font-weight: 700; color: var(--accent);
  margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
}
.ai-card-title::before {
  content: ''; display: block;
  width: 3px; height: 18px; border-radius: 2px;
  background: var(--accent);
}

/* Findings */
.finding {
  margin-bottom: 20px; padding-bottom: 20px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.finding:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.finding-num {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--accent); margin-bottom: 4px; font-family: var(--mono);
}
.finding-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.finding-body { font-size: 13px; line-height: 1.7; color: rgba(255,255,255,.75); }
.finding-basis {
  margin-top: 8px; font-size: 11px; color: var(--muted);
  font-style: italic; line-height: 1.5;
}

/* Risk tags */
.risk-item { margin-bottom: 20px; }
.risk-item:last-child { margin-bottom: 0; }
.risk-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.risk-tag {
  font-size: 10px; font-weight: 700; padding: 3px 10px;
  border-radius: 20px; text-transform: uppercase; letter-spacing: 1px;
  font-family: var(--mono);
}
.risk-HIGH { background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
.risk-MED  { background: rgba(251,191,36,0.15);  color: var(--yellow); border: 1px solid rgba(251,191,36,0.3); }
.risk-LOW  { background: rgba(52,211,153,0.15);  color: var(--green); border: 1px solid rgba(52,211,153,0.3); }
.risk-title { font-size: 14px; font-weight: 700; }
.risk-body { font-size: 13px; line-height: 1.7; color: rgba(255,255,255,.75); }

/* Chain analysis */
.chain-item {
  margin-bottom: 24px; padding: 20px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 12px;
}
.chain-topic { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
.chain-steps { display: flex; flex-direction: column; gap: 12px; }
.chain-step {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 13px; line-height: 1.6;
}
.chain-fact   { background: rgba(34,211,238,0.06); }
.chain-cause  { background: rgba(167,139,250,0.06); }
.chain-fcst   { background: rgba(251,146,60,0.06); }
.chain-action { background: rgba(52,211,153,0.06); }
.chain-icon { font-size: 18px; flex-shrink: 0; width: 24px; text-align: center; }
.chain-text { color: rgba(255,255,255,.8); }
.chain-text strong { color: var(--text); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }

/* Recommendations */
.rec-item {
  margin-bottom: 12px;
  border-radius: 10px; overflow: hidden;
  display: flex;
}
.rec-stripe { width: 4px; flex-shrink: 0; }
.rec-URGENT  .rec-stripe { background: var(--red); }
.rec-IMPORTANT .rec-stripe { background: var(--yellow); }
.rec-STRATEGIC .rec-stripe { background: var(--purple); }
.rec-body { padding: 14px 18px; flex: 1; background: rgba(255,255,255,0.04); }
.rec-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  font-weight: 700; margin-bottom: 6px;
}
.rec-URGENT    .rec-label { color: var(--red); }
.rec-IMPORTANT .rec-label { color: var(--yellow); }
.rec-STRATEGIC .rec-label { color: var(--purple); }
.rec-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.rec-text { font-size: 13px; color: rgba(255,255,255,.75); line-height: 1.6; }
.rec-basis { font-size: 11px; color: var(--muted); margin-top: 6px; font-style: italic; }

/* ── TOOLS GRID ── */
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.tool-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
  backdrop-filter: blur(20px);
}
.tool-name { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.tool-bar {
  height: 6px; border-radius: 3px;
  background: rgba(255,255,255,0.1); margin-bottom: 6px;
}
.tool-fill { height: 100%; border-radius: 3px; transition: width .8s ease; }
.tool-pct { font-size: 11px; color: var(--muted); font-family: var(--mono); }

/* ── TASKS ── */
.task-list { display: flex; flex-direction: column; gap: 8px; }
.task-item {
  display: flex; align-items: flex-start; gap: 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px;
}
.task-status {
  font-size: 10px; text-transform: uppercase; font-weight: 700;
  padding: 2px 8px; border-radius: 10px; white-space: nowrap; margin-top: 2px;
}
.status-done     { background: rgba(52,211,153,0.15); color: var(--green); }
.status-overdue  { background: rgba(248,113,113,0.15); color: var(--red); }
.status-active   { background: rgba(34,211,238,0.15); color: var(--accent); }
.task-text { flex: 1; font-size: 13px; line-height: 1.5; }
.task-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* ── NOTES ── */
.note-btn {
  position: absolute; top: 12px; right: 12px;
  background: rgba(255,255,255,0.08); border: 1px solid var(--border);
  border-radius: 6px; color: var(--muted); font-size: 11px;
  padding: 4px 8px; cursor: pointer; z-index: 5;
  transition: all .2s; white-space: nowrap;
}
.note-btn:hover { color: var(--text); border-color: var(--accent); }
.note-btn.has-note { color: var(--yellow); border-color: rgba(251,191,36,0.4); }

.note-display {
  margin-top: 8px; padding: 8px 12px;
  background: rgba(251,191,36,0.08);
  border-left: 3px solid var(--yellow);
  border-radius: 0 6px 6px 0;
  font-size: 12px; color: var(--text); line-height: 1.5;
  display: none;
}
.note-display.visible { display: block; }
.note-display .note-meta { font-size: 10px; color: var(--muted); margin-bottom: 4px; }

/* Note modal */
#noteModal {
  display: none; position: fixed; inset: 0; z-index: 500;
  align-items: center; justify-content: center;
  background: rgba(5,15,5,0.75); backdrop-filter: blur(8px);
}
#noteModal.open { display: flex; }
.note-modal-box {
  background: rgba(10,22,10,0.97);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 28px;
  width: 420px; max-width: 95vw;
  backdrop-filter: blur(20px);
}
.note-modal-title {
  font-size: 14px; font-weight: 700; margin-bottom: 12px;
  color: var(--accent);
}
.note-modal-period {
  font-size: 11px; color: var(--muted); margin-bottom: 16px;
}
.note-textarea {
  width: 100%; min-height: 100px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 8px; padding: 12px;
  color: var(--text); font-family: var(--font);
  font-size: 13px; line-height: 1.6;
  resize: vertical; outline: none;
}
.note-textarea:focus { border-color: var(--accent); }
.note-modal-btns {
  display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end;
}
.note-del-btn {
  margin-right: auto; background: transparent;
  border: 1px solid rgba(248,113,113,0.3); color: var(--red);
  border-radius: 8px; padding: 7px 14px; cursor: pointer;
  font-family: var(--font); font-size: 12px;
}
.note-del-btn:hover { background: rgba(248,113,113,0.1); }

/* ── LOADER ── */
.loading-overlay {
  position: fixed; inset: 0; z-index: 200;
  display: none; align-items: center; justify-content: center;
  background: rgba(5,15,5,0.7); backdrop-filter: blur(8px);
  flex-direction: column; gap: 16px;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 40px; height: 40px;
  border: 3px solid rgba(34,211,238,0.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--muted); }

/* ── STUB ── */
.stub {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 20px; color: var(--muted);
  font-size: 13px; gap: 12px;
}
.stub-icon { font-size: 36px; }
.stub-title { font-size: 16px; font-weight: 600; color: var(--text); }

/* ── CKP TABLE ── */
.ckp-table-wrap { overflow-x: auto; }
.progress-bar { display: flex; align-items: center; gap: 8px; }
.progress-track { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; min-width: 80px; }
.progress-fill  { height: 100%; border-radius: 3px; }

/* ── DEMO BADGE ── */
.demo-badge {
  position: fixed; bottom: 16px; right: 16px; z-index: 300;
  background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.3);
  color: var(--yellow); font-size: 11px; font-weight: 700;
  padding: 6px 14px; border-radius: 20px; letter-spacing: 1px;
  backdrop-filter: blur(10px);
}

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  header { padding: 10px 12px; gap: 10px; }
  .period-group { margin-left: 0; width: 100%; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .chart-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Grass iframe -->
<iframe id="grassFrame" src="grass_bg.html" title="background"></iframe>
<div id="vignette"></div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Загрузка данных…</div>
</div>

<!-- PASSWORD GATE -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo"><span class="r">ROCKET</span></div>
    <div class="gate-sub">Финансовый дашборд · Управленческая отчётность</div>
    <input type="password" class="gate-input" id="pwInput" placeholder="••••••••"

/* ═══════════════════════════════════════════════

═══════════════════════════════════════════════ */
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function checkPassword() {
  const val = document.getElementById('pwInput').value;
  const hash = await sha256(val);
  if (hash === CONFIG.PASSWORD_HASH) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('gateError').textContent = 'Неверный пароль';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function buildTabs() {
  const nav = document.getElementById('tabNav');
  const main = document.getElementById('mainContent');
  nav.innerHTML = '';
  main.innerHTML = '';
  TABS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (t.id === state.activeTab ? ' active' : '');
    btn.textContent = t.label;
    btn.onclick = () => switchTab(t.id);
    nav.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'panel' + (t.id === state.activeTab ? ' active' : '');
    panel.id = 'panel-' + t.id;
    main.appendChild(panel);
  });
}

function switchTab(id) {
  state.activeTab = id;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', TABS[i].id === id);
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.classList.toggle('active', p.id === 'panel-' + id);
  });
  renderCurrentTab();
}

function buildPeriodSelectors() {
  const from = document.getElementById('periodFrom');
  const to   = document.getElementById('periodTo');
  DEMO.months.forEach((m, i) => {
    from.add(new Option(m, i));
    to.add(new Option(m, i));
  });
  from.value = state.fromIdx;
  to.value   = state.toIdx;
}

function applyPeriod() {
  state.fromIdx = parseInt(document.getElementById('periodFrom').value);
  state.toIdx   = parseInt(document.getElementById('periodTo').value);
  if (state.fromIdx > state.toIdx) {
    state.toIdx = state.fromIdx;
    document.getElementById('periodTo').value = state.toIdx;
  }
  renderCurrentTab();
}

function slice(arr) {

let _noteTarget = null; // { chartId, cardEl }

function noteKey(chartId) {
  return `note:${chartId}:${state.fromIdx}-${state.toIdx}`;
}

function attachNote(canvasId, chartTitle) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const card = canvas.closest('.chart-card');
  if (!card) return;

  // Ensure position relative
  card.style.position = 'relative';

  // Remove existing btn if any
  card.querySelector('.note-btn')?.remove();
  card.querySelector('.note-display')?.remove();

  // Button
  const btn = document.createElement('button');
  btn.className = 'note-btn';
  btn.title = 'Добавить заметку';
  const key = noteKey(canvasId);
  const existing = state.notes[key];
  btn.textContent = existing ? '📝 Заметка ✓' : '📝 Заметка';
  if (existing) btn.classList.add('has-note');
  btn.onclick = () => openNoteModal(canvasId, chartTitle || canvasId, card);
  card.appendChild(btn);

  // Note display
  if (existing) {
    const nd = document.createElement('div');
    nd.className = 'note-display visible';
    nd.id = 'note-display-' + canvasId;
    nd.innerHTML = `<div class="note-meta">📝 ${existing.date}</div>${existing.text}`;
    card.appendChild(nd);
  }
}

function openNoteModal(chartId, title, cardEl) {
  _noteTarget = { chartId, cardEl };
  const key = noteKey(chartId);
  const existing = state.notes[key];
  document.getElementById('noteModalTitle').textContent = '📝 ' + title;
  document.getElementById('noteModalPeriod').textContent =
    'Период: ' + (DEMO.months[state.fromIdx] || '') + ' — ' + (DEMO.months[state.toIdx] || '');
  document.getElementById('noteTextarea').value = existing ? existing.text : '';
  document.getElementById('noteModal').classList.add('open');
  setTimeout(() => document.getElementById('noteTextarea').focus(), 100);
}

function closeNoteModal() {
  document.getElementById('noteModal').classList.remove('open');
  _noteTarget = null;
}

function saveNote() {
  if (!_noteTarget) return;
  const text = document.getElementById('noteTextarea').value.trim();
  if (!text) { deleteNote(); return; }
  const key = noteKey(_noteTarget.chartId);
  state.notes[key] = { text, date: new Date().toLocaleDateString('ru') };
  localStorage.setItem('rkt_notes', JSON.stringify(state.notes));
  // refresh button + display
  attachNote(_noteTarget.chartId, document.getElementById('noteModalTitle').textContent.replace('📝 ',''));
  closeNoteModal();
}

function deleteNote() {
  if (!_noteTarget) return;
  const key = noteKey(_noteTarget.chartId);
  delete state.notes[key];
  localStorage.setItem('rkt_notes', JSON.stringify(state.notes));
  attachNote(_noteTarget.chartId, '');
  closeNoteModal();
}

/* ═══════════════════════════════════════════════

function makeChart(canvasId, config) {
  if (state.charts[canvasId]) {
    state.charts[canvasId].destroy();
    delete state.charts[canvasId];
  }
  const ctx = document.getElementById(canvasId);
  if (!ctx) return null;
  const chart = new Chart(ctx, {
    ...config,
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: 'rgba(255,255,255,0.6)', font: { family:'Outfit', size:11 } } },
        tooltip: {
          backgroundColor: 'rgba(5,15,5,0.95)',
          borderColor: 'rgba(255,255,255,0.15)', borderWidth: 1,
          titleColor:'rgba(255,255,255,0.9)', bodyColor:'rgba(255,255,255,0.7)',
          callbacks: {
            label: ctx => {
              const v = ctx.raw;
              if (typeof v === 'number' && Math.abs(v) > 1000)
                return ' ' + ctx.dataset.label + ': ' + fmt(v);
              return ' ' + ctx.dataset.label + ': ' + (typeof v === 'number' ? v.toFixed(1) : v);
            }
          }
        }
      },
      scales: config.type === 'bar' || config.type === 'line' ? {
        x: { ticks: { color:'rgba(255,255,255,0.5)', font:{family:'Outfit',size:11} }, grid:{color:'rgba(255,255,255,0.05)'} },
        y: { ticks: { color:'rgba(255,255,255,0.5)', font:{family:'JetBrains Mono',size:11}, callback: v => Math.abs(v)>=1000?fmt(v):v }, grid:{color:'rgba(255,255,255,0.07)'} }
      } : {},
      ...config.options,
    }
  });
  state.charts[canvasId] = chart;
  // auto-attach note button (title extracted from sibling .chart-title)
  requestAnimationFrame(() => {
    const cv = document.getElementById(canvasId);
    const title = cv?.closest('.chart-card')?.querySelector('.chart-title')?.textContent || canvasId;
    attachNote(canvasId, title);
  });
  return chart;
}

const COLORS = {
  cyan:   'rgba(34,211,238,',
  green:  'rgba(52,211,153,',
  red:    'rgba(248,113,113,',
  purple: 'rgba(167,139,250,',
  orange: 'rgba(251,146,60,',
  yellow: 'rgba(251,191,36,',
};
const c = (color, alpha=0.85) => COLORS[color] + alpha + ')';

function fmt(n, currency = true) {
  if (n === undefined || n === null) return '—';
  const abs = Math.abs(n);
  let s;
  if (abs >= 1000000) s = (n / 1000000).toFixed(1) + 'M';
  else if (abs >= 1000) s = (n / 1000).toFixed(0) + 'K';
  else s = n.toFixed(0);
  return (n < 0 ? '-' : '') + s;
}

function fmtFull(n) {
  if (n === undefined || n === null) return '—';
  return n.toLocaleString('ru');
}

function last(arr) { return arr[arr.length - 1]; }
function prev(arr) { return arr.length > 1 ? arr[arr.length - 2] : arr[0]; }
function sum(arr) { return arr.reduce((a,b) => a+b, 0); }
function avg(arr) { return sum(arr) / arr.length; }

function deltaPct(cur, prv) {
  if (!prv) return 0;
  return ((cur - prv) / Math.abs(prv) * 100).toFixed(1);
}

function deltaClass(val, invert = false) {
  if (val > 0) return invert ? 'delta-neg' : 'delta-pos';
  if (val < 0) return invert ? 'delta-pos' : 'delta-neg';
  return 'delta-neu';
}

function kpiCard(label, value, delta, deltaLabel, inverted = false) {
  const cls = deltaClass(parseFloat(delta), inverted);
  const sign = parseFloat(delta) > 0 ? '+' : '';
  return `<div class="kpi-card">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    <div class="kpi-delta ${cls}">${sign}${delta}% <span style="color:var(--muted);font-size:10px">${deltaLabel}</span></div>
  </div>`;
}

function renderModel(d) {
  const p = document.getElementById('panel-model');
  const lastRev = last(slice(d.revenue));
  const lastVC  = last(slice(d.var_costs));
  const lastInd = last(slice(d.indirect));
  // Simple forecast: project 6 months ahead
  const foreMonths = ['Июн 2026','Июл 2026','Авг 2026','Сен 2026','Окт 2026','Дек 2026'];
  const growth = [0.02, 0.05, 0.07, 0.10, 0.13, 0.18]; // recovery scenario
  const foreRev = growth.map(g => Math.round(lastRev * (1 + g)));
  const foreVC  = growth.map(g => Math.round(lastVC  * (1 + g * 0.7)));
  const foreInd = foreMonths.map(() => Math.round(lastInd * 1.02));
  const foreInt = foreMonths.map(() => 42000);
  const foreNP  = foreRev.map((_,i) => foreRev[i] - foreVC[i] - foreInd[i] - foreInt[i]);

  p.innerHTML = `
  <div style="font-size:12px;color:var(--muted);margin-bottom:16px">Прогнозная модель на 6 месяцев — сценарий восстановления. <span style="color:var(--yellow)">Базируется на демо-данных.</span></div>
  <div class="kpi-row">
    ${kpiCard('Прогноз выручки (дек)', fmt(last(foreRev)), deltaPct(last(foreRev),lastRev), 'vs факт май')}
    ${kpiCard('Прогноз ЧП (дек)', fmt(last(foreNP)), '', '', last(foreNP)<0)}
    ${kpiCard('Точка безубыт.', fmt(lastInd + 42000), '', '')}
    ${kpiCard('Рост за 6 мес.', '+' + Math.round(growth[5]*100) + '%', '', '')}
  </div>

  <div class="chart-grid">
    <div class="chart-card wide">
      <div class="chart-title">Прогноз выручки и ЧП на 6 месяцев</div>
      <div class="chart-wrap tall"><canvas id="ch_model_main"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Прогноз структуры расходов</div>
      <div class="chart-wrap"><canvas id="ch_model_costs"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Точка безубыточности vs выручка</div>
      <div class="chart-wrap"><canvas id="ch_model_bep"></canvas></div>
    </div>
  </div>

  <div class="chart-card" style="margin-top:0">
    <div class="chart-title">Прогнозный P&L</div>
    <div style="overflow-x:auto">
    <table class="data-table">
      <thead><tr><th style="min-width:180px">Статья</th>${foreMonths.map(m=>`<th>${m}</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td>Выручка (прогноз)</td>${foreRev.map(v=>`<td class="pos">${fmtFull(v)}</td>`).join('')}</tr>
        <tr><td>Перем. расходы</td>${foreVC.map(v=>`<td class="neg">${fmtFull(-v)}</td>`).join('')}</tr>
        <tr><td>Постоянные расходы</td>${foreInd.map(v=>`<td class="neg">${fmtFull(-v)}</td>`).join('')}</tr>
        <tr><td>Проценты</td>${foreInt.map(v=>`<td class="neg">${fmtFull(-v)}</td>`).join('')}</tr>
        <tr class="total-row"><td>ЧП (прогноз)</td>${foreNP.map(v=>`<td class="${v>=0?'pos':'neg'}">${fmtFull(v)}</td>`).join('')}</tr>
      </tbody>
    </table></div>
  </div>`;

  const allMonths = [...slice(d.months), ...foreMonths];
  const allRev    = [...slice(d.revenue), ...foreRev];
  const allNP     = [...slice(d.net_profit), ...foreNP];
  const splitAt   = slice(d.months).length;

  makeChart('ch_model_main', {
    type: 'bar',
    data: { labels: allMonths, datasets: [
      { label:'Факт выручка',    data: allRev.slice(0, splitAt),    backgroundColor:c('cyan',0.55),  borderWidth:0 },
      { label:'Прогноз выручка', data: [...allRev.slice(0,splitAt).map(()=>null), ...foreRev], backgroundColor:c('cyan',0.3), borderWidth:1, borderColor:c('cyan',0.6), borderDash:[4,4] },
      { label:'Факт ЧП',         data: allNP.slice(0, splitAt),     type:'line', borderColor:c('green'), backgroundColor:'transparent', borderWidth:2, pointRadius:3, tension:0.3 },
      { label:'Прогноз ЧП',      data: [...allNP.slice(0,splitAt).map(()=>null), ...foreNP], type:'line', borderColor:c('yellow'), backgroundColor:'transparent', borderWidth:2, borderDash:[5,5], pointRadius:3, tension:0.3 },
    ]}
  });

  makeChart('ch_model_costs', {
    type: 'bar',
    data: { labels: foreMonths, datasets: [
      { label:'Переменные', data:foreVC,  backgroundColor:c('red',0.6), borderWidth:0 },
      { label:'Постоянные', data:foreInd, backgroundColor:c('purple',0.6), borderWidth:0 },
      { label:'Проценты',   data:foreInt, backgroundColor:c('orange',0.6), borderWidth:0 },
    ]},
    options: { scales:{ x:{stacked:true}, y:{stacked:true} } }
  });

  const bepLine = foreMonths.map(() => lastInd + 42000);
  makeChart('ch_model_bep', {
    type: 'line',
    data: { labels: foreMonths, datasets: [
      { label:'Прогноз выручки', data:foreRev, borderColor:c('cyan'), backgroundColor:c('cyan',0.1), fill:true, borderWidth:2, tension:0.3 },
      { label:'Точка безубыт.', data:bepLine, borderColor:c('red'), backgroundColor:'transparent', borderDash:[6,4], borderWidth:2, pointRadius:0 },
    ]}
  });
}

  if (!CONFIG.DEMO && CONFIG.APPS_SCRIPT_URL !== 'YOUR_APPS_SCRIPT_URL_HERE') {
    grid.innerHTML = '<div style="color:var(--muted);font-size:13px">Загрузка…</div>';

  }
}

  grid.innerHTML = tools.map(t => `
  <div class="tool-card">

  </div>`).join('');
}

function toggleExportMenu() {
  document.getElementById('exportMenu').classList.toggle('open');

function exportExcel() {
  document.getElementById('exportMenu').classList.remove('open');
  const d = state.data;
  const ms = slice(d.months);
  const wb = XLSX.utils.book_new();

  // P&L Sheet
  const pnlData = [
    ['Статья', ...ms, 'Итого'],
    ['Выручка', ...slice(d.revenue), sum(slice(d.revenue))],
    ['Переменные расходы', ...slice(d.var_costs).map(v=>-v), -sum(slice(d.var_costs))],
    ['Валовая прибыль', ...slice(d.revenue).map((v,i)=>v-slice(d.var_costs)[i]), sum(slice(d.revenue))-sum(slice(d.var_costs))],
    ['Постоянные расходы', ...slice(d.indirect).map(v=>-v), -sum(slice(d.indirect))],
    ['EBIT', ...slice(d.op_profit), sum(slice(d.op_profit))],
    ['Проценты', ...slice(d.interest).map(v=>-v), -sum(slice(d.interest))],
    ['Чистая прибыль', ...slice(d.net_profit), sum(slice(d.net_profit))],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pnlData), 'ОПиУ');

  // Cash Flow
  const cfData = [
    ['Статья', ...ms],
    ['NCF операционный', ...slice(d.ncf_op)],
    ['NCF инвестиционный', ...slice(d.ncf_inv)],
    ['NCF финансовый', ...slice(d.ncf_fin)],
    ['Дивиденды', ...slice(d.dividends).map(v=>-v)],
    ['Остаток ДС', ...slice(d.cash)],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cfData), 'ДДС');

  // Balance
  const balData = [
    ['Показатель', ...ms],
    ['Активы всего', ...slice(d.assets_total)],
    ['Капитал', ...slice(d.equity)],
    ['Обязательства', ...slice(d.liabilities)],
    ['Текущая ликвидность', ...slice(d.current_ratio)],
    ['Коэф. автономии', ...slice(d.autonomy)],
    ['D/E', ...slice(d.de_ratio)],
    ['DFL', ...slice(d.dfl)],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(balData), 'Баланс');

  // Traffic
  const trData = [
    ['Показатель', ...ms],
    ['CRM %', ...slice(d.crm_pct)],
    ['FTD новые', ...slice(d.ftd_new)],
    ['FTD база', ...slice(d.ftd_old)],
    ['Расходы FB', ...slice(d.tr_fb)],
    ['Расходы TG', ...slice(d.tr_tg)],
    ['Rev Core', ...slice(d.rev_core)],
    ['Rev Influence', ...slice(d.rev_influence)],
    ['Rev Streams', ...slice(d.rev_streams)],
    ['Rev Mannequin', ...slice(d.rev_mannequin)],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(trData), 'Трафик');

  const filename = `ROCKET_Dashboard_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, filename);
  document.getElementById('exportMenu').classList.remove('open');
}

async function exportPDF() {
  document.getElementById('exportMenu').classList.remove('open');
  showLoader('Формирование PDF…');
  try {
    const { jsPDF } = window.jspdf;
    const canvas = await html2canvas(document.getElementById('mainContent'), {
      backgroundColor: '#050f05', scale: 1.5, useCORS: true, logging: false
    });
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3' });
    const pdfW = pdf.internal.pageSize.getWidth();
    const pdfH = (canvas.height * pdfW) / canvas.width;
    let y = 0, pageH = pdf.internal.pageSize.getHeight();
    while (y < pdfH) {
      if (y > 0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, -y, pdfW, pdfH);
      y += pageH;
    }
    pdf.save(`ROCKET_Dashboard_${new Date().toISOString().slice(0,10)}.pdf`);
  } catch(e) { alert('Ошибка PDF: ' + e.message); }
  hideLoader();
}
