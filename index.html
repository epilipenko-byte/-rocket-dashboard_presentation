<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket — Live Financial Dashboard v4</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
--bg:#0a0e17;--surface:rgba(17,24,39,.7);--surface2:#1a2332;
--border:#1e2d3d;--border-hover:rgba(34,211,238,.3);
--text:#e2e8f0;--text-muted:#64748b;--text-dim:rgba(100,116,139,.6);
--accent:#22d3ee;--accent-dim:rgba(34,211,238,.4);
--green:#34d399;--green-bg:rgba(52,211,153,.15);
--red:#f87171;--red-bg:rgba(248,113,113,.12);
--orange:#fb923c;--orange-bg:rgba(251,146,60,.12);
--yellow:#fbbf24;--purple:#a78bfa;--purple-bg:rgba(167,139,250,.12);
--cyan:#06b6d4;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:transparent;color:var(--text);min-height:100vh}
/* AUTH */
#auth{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 30% 20%,rgba(167,139,250,.04) 0%,transparent 60%),var(--bg);position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:380px;text-align:center}
.auth-box h2{font-family:'Outfit',sans-serif;font-weight:800;font-size:28px;color:var(--accent);margin-bottom:8px}
.auth-box p{font-size:12px;color:var(--text-dim);margin-bottom:24px;letter-spacing:1px}
.auth-box input{width:100%;padding:12px 16px;background:rgba(15,25,15,.6);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;margin-bottom:14px}
.auth-box input:focus{border-color:var(--accent-dim)}
.auth-box button{width:100%;padding:12px;background:rgba(167,139,250,.2);border:1px solid var(--border-hover);border-radius:10px;color:var(--accent);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:all .3s}
.auth-box button:hover{background:rgba(167,139,250,.35)}
.auth-err{color:var(--red);font-size:11px;margin-top:6px;display:none}
/* MAIN */
#app{display:none;position:relative;z-index:9999;will-change:transform}
.hdr{padding:18px 32px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;background:rgba(10,14,23,.93)}
.hdr-left{display:flex;align-items:center;gap:14px}
.hdr h1{font-family:'Outfit',sans-serif;font-size:28px;font-weight:800;letter-spacing:-1px;display:flex;align-items:baseline;gap:4px}
.logo-rocket{color:#f87171}
.logo-dash{color:rgba(255,255,255,.4);font-size:28px;font-weight:300}
.hdr h1 em{font-style:italic;color:var(--text)}
.hdr .period-tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.4);padding:4px 10px;border:1px solid var(--border);border-radius:6px;letter-spacing:1px}
.hdr-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-muted);font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:5px;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase}
.btn:hover{border-color:var(--border-hover);color:var(--accent)}
.btn-glow{background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.25);color:var(--accent)}
.btn-glow:hover{background:rgba(167,139,250,.3)}
.btn-live{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:var(--green)}
.sel{padding:6px 10px;background:rgba(15,25,15,.6);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:10px;outline:none;cursor:pointer}
.sel:focus{border-color:var(--accent-dim)}
.status{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.status.offline{background:var(--red);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* TABS */
.tabs{display:flex;gap:1px;padding:0 32px;border-bottom:1px solid var(--border);background:rgba(10,14,23,.92);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 20px;font-size:14px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .3s;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase}
.tab:hover{color:var(--text)}
.tab.active{color:#22d3ee;border-bottom-color:#22d3ee;text-shadow:0 0 12px rgba(34,211,238,.3)}
/* CONTENT */
.content{padding:20px 32px 60px;background:linear-gradient(180deg,rgba(8,11,20,.92) 0%,rgba(8,11,20,.88) 50%,rgba(8,11,20,.92) 100%);border-radius:0}
.pane{display:none}.pane.active{display:block}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:rgba(10,14,23,.72);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:all .4s;position:relative;overflow:hidden}
.kpi:hover{border-color:var(--border-hover);background:var(--surface2);transform:translateY(-2px)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent-dim);opacity:.4}
.kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:8px}
.kpi-val{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--text);margin-bottom:4px}
.kpi-sub{font-family:'JetBrains Mono',monospace;font-size:12px}
.up{color:var(--green)}.dn{color:var(--red)}.nt{color:var(--text-dim)}.wr{color:var(--orange)}
/* CHARTS */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px}
.card{background:rgba(10,14,23,.75);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:border-color .3s;position:relative}
.card:hover{border-color:var(--border-hover)}
.card.full{grid-column:1/-1}
.card-title{font-family:'Outfit',sans-serif;font-weight:400;font-size:15px;margin-bottom:12px;color:var(--text);display:flex;align-items:center;gap:8px}
.card-title .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.cw{position:relative;height:250px}.cw.tall{height:300px}.cw.short{height:180px}
/* TABLES */
.tw{overflow-x:auto;margin-top:8px}
table.dt{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:10px}
table.dt th{background:rgba(15,25,15,.6);color:var(--text-dim);font-weight:500;text-align:right;padding:7px 10px;border-bottom:1px solid var(--border);font-size:9px;text-transform:uppercase;letter-spacing:.5px}
table.dt th:first-child{text-align:left}
table.dt td{padding:6px 10px;text-align:right;border-bottom:1px solid rgba(167,139,250,.06)}
table.dt td:first-child{text-align:left;font-family:'Outfit',sans-serif;font-weight:400;color:var(--text)}
table.dt tr.tot td{font-weight:700;border-top:2px solid var(--border);padding-top:8px}
table.dt tr:hover td{background:rgba(167,139,250,.03)}
/* ANALYSIS */
.asec{background:rgba(10,14,23,.75);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:24px 28px;margin-bottom:16px}
.asec h3{font-family:'Outfit',sans-serif;font-weight:400;font-size:18px;margin-bottom:14px;color:var(--text)}
.finding{margin-bottom:16px;padding-left:0}
.finding-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-right:6px}
.finding p{font-size:13px;line-height:1.7;color:var(--text);opacity:.85;margin-top:4px}
.finding .basis{font-size:10px;color:var(--text-dim);margin-top:4px;padding:4px 8px;background:rgba(15,25,15,.5);border:1px solid var(--border);border-radius:4px;display:inline-block;font-family:'JetBrains Mono',monospace}
.rtag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace}
.rtag.hi{background:var(--red-bg);color:var(--red)}
.rtag.md{background:var(--orange-bg);color:var(--orange)}
.rtag.lo{background:var(--green-bg);color:var(--green)}
.rec{background:rgba(15,25,15,.5);border-left:3px solid var(--accent-dim);padding:14px 18px;margin-bottom:10px;border-radius:0 10px 10px 0;transition:border-color .3s}
.rec:hover{border-left-color:var(--accent)}
.rec h4{font-size:13px;font-weight:500;margin-bottom:3px;color:var(--text)}
.rec p{font-size:12px;color:var(--text-muted);margin:0}
.rec.urg{border-left-color:var(--red)}.rec.imp{border-left-color:var(--orange)}.rec.str{border-left-color:var(--purple)}
/* THRESHOLD */
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:10px}
.th-item{background:rgba(15,25,15,.5);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;border-left:3px solid var(--border);transition:all .3s}
.th-item:hover{background:rgba(20,35,20,.5)}
.th-item.alert{border-left-color:var(--red)}.th-item.warning{border-left-color:var(--orange)}.th-item.ok{border-left-color:var(--green)}
.th-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.th-item.alert .th-dot{background:var(--red)}.th-item.warning .th-dot{background:var(--orange)}.th-item.ok .th-dot{background:var(--green)}
.th-lbl{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
.th-txt{font-size:11px}
/* NOTES */
.note-btn{position:absolute;top:8px;right:10px;background:rgba(15,25,15,.6);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:10px;color:var(--text-dim);cursor:pointer;z-index:2;transition:all .2s}
.note-btn:hover{border-color:var(--accent-dim);color:var(--accent)}
.note-panel{display:none;position:absolute;top:30px;right:0;background:rgba(8,16,8,.95);border:1px solid var(--border);border-radius:10px;padding:12px 14px;width:300px;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.note-panel.open{display:block}
.note-entry{background:rgba(15,25,15,.5);border-radius:6px;padding:8px;margin-bottom:6px;border-left:2px solid var(--accent-dim)}
.note-form{display:flex;gap:6px;margin-top:8px}
.note-input{flex:1;padding:6px 8px;background:rgba(15,25,15,.6);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;outline:none}
.note-submit{padding:6px 10px;background:rgba(167,139,250,.2);border:1px solid var(--border-hover);border-radius:6px;color:var(--accent);font-size:10px;font-weight:600;cursor:pointer}
/* DATA SOURCE BADGE */
.ds-badge{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--text-dim);background:rgba(15,25,15,.5);border:1px solid var(--border);border-radius:4px;padding:3px 8px;margin-bottom:10px}
.ds-badge.live{color:var(--green);border-color:rgba(52,211,153,.2)}
.ds-badge.demo{color:var(--orange);border-color:rgba(251,146,60,.2)}
/* RAW TABLE */
.raw-table-wrap{overflow-x:auto;max-height:400px;overflow-y:auto}
.raw-table-wrap table.dt{font-size:9px}
/* PAYMENT CALENDAR */
.pay-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:rgba(15,25,15,.4);margin-bottom:6px;border-left:3px solid var(--border)}
.pay-row.pay-out{border-left-color:var(--red)}
.pay-row.pay-in{border-left-color:var(--green)}
.pay-row.pay-plan{border-left-color:var(--orange)}
.pay-date{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);min-width:60px}
.pay-name{font-size:12px;flex:1}
.pay-amt{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
/* TASK STATUS */
.task-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:rgba(15,25,15,.4);margin-bottom:6px}
.task-status{font-size:9px;padding:2px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-weight:600;white-space:nowrap}
.task-status.done{background:var(--green-bg);color:var(--green)}
.task-status.wip{background:var(--orange-bg);color:var(--orange)}
.task-status.late{background:var(--red-bg);color:var(--red)}
.task-status.todo{background:rgba(100,116,139,.1);color:var(--text-muted)}
/* LOADING */
.ld-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(8px)}
.ld-overlay.on{display:flex}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
/* PROGRESS */
.pbar{position:fixed;top:0;left:0;height:2px;background:var(--accent-dim);z-index:200;width:0;transition:width .3s}
/* REVEAL */
[data-reveal]{opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
[data-reveal].revealed{opacity:1;transform:translateY(0)}
/* RESPONSIVE */
@media(max-width:900px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.content{padding:14px 16px 40px}.hdr{padding:12px 16px 8px}.kpi-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.kpi-row{grid-template-columns:1fr 1fr}.tabs{padding:0 12px}.hdr h1{font-size:16px}}
</style>
</head>
<body>
<iframe id="grass-bg" src="grass_bg.html" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;border:none;pointer-events:none"></iframe>
<div class="pbar" id="pbar"></div>
<!-- AUTH -->
<div id="auth">
<div class="auth-box">
<h2>Rocket</h2>
<p>Live Financial Dashboard</p>
<input type="password" id="pwd" placeholder="Пароль" onkeydown="if(event.key==='Enter')login()">
<button onclick="login()">Войти</button>
<div class="auth-err" id="aerr">Неверный пароль</div>
</div>
</div>
<!-- LOADING -->
<div class="ld-overlay" id="ld"><div><div class="spinner"></div><div style="color:var(--text-dim);font-size:13px;text-align:center" id="ld-txt">Загрузка...</div></div></div>
<!-- APP -->
<div id="app">
<div class="hdr">
<div class="hdr-left">
<h1><span class="logo-rocket">ROCKET</span> <span class="logo-dash">— Финансовый анализ</span></h1>
<span class="period-tag" id="ptag">YTD 2026</span>
</div>
<div class="hdr-actions">
<span style="font-size:10px;color:var(--text-dim);margin-right:4px">с</span>
<select class="sel" id="pFrom" onchange="onPeriod()" style="width:90px">
<option value="0" selected>Январь</option>

</select>

<select class="sel" id="pTo" onchange="onPeriod()" style="width:90px">
<option value="0">Январь</option>
<option value="1">Февраль</option>
<option value="2">Март</option>
<option value="3">Апрель</option>
<option value="4" selected>Май</option>
</select>
<button class="btn btn-live" onclick="fetchData()">↻ Обновить данные</button>
<button class="btn" onclick="fetchAI()">⚡ AI Анализ</button>
<button class="btn btn-glow" onclick="downloadReport()">⬇ Скачать</button>
<span class="status" id="live-dot" title="Live"></span>
<span id="updated-at" style="font-size:9px;color:var(--text-dim);font-family:'JetBrains Mono',monospace"></span>
</div>
</div>

<div class="content" id="main"></div>
</div>

<script>
// ===== CONFIG =====
// DATA_PROXY_URL: вставьте URL вашего Google Apps Script Web App
// Получить: Расширения → Apps Script → Развернуть → Веб-приложение → Скопировать URL
const C={
  DATA_PROXY:'https://script.google.com/macros/s/AKfycbxHphPAsDe6o2vvhgjmZx51CZ151J1pvuc93QxjT8hfKuAHzcVcIvKdwOAIKQBYluSl/exec',
  AI:'WEBHOOK_AI_ANALYSIS_URL',
  TOOLS:'https://script.google.com/macros/s/AKfycbwxYcEODuv8V9XIuXpyJ6giQOE8pXpHZITkznxqzTSuLef4HYlY1eHdwaBOvAvO8Sbh/exec',
  TM:'https://script.google.com/a/macros/rocketpeople.tech/s/AKfycbxTers8chtwgwkIh5cDNJI-9McA6Rj0GPSywQey0g3ygKqKSTaB9ZS8P2e5s7nopzWa/exec',
  CONFIG_SHEET:'https://docs.google.com/spreadsheets/d/1EKR-czK1UvXZDIJUe5MLb70yZXyEMe1VIYTx15UOY3E/edit',
  PWD_HASH:'5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8',
  DEMO: false
};

// ===== AUTH =====
async function login(){const h=await sha(document.getElementById('pwd').value);if(h===C.PWD_HASH||C.DEMO){document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';init()}else{document.getElementById('aerr').style.display='block'}}
async function sha(m){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

// ===== TABS =====
const TABS=[
{id:'overview',label:'Обзор',v:true},
{id:'pnl',label:'ОПиУ',v:true},
{id:'pnl_combo',label:'ОПиУ блоки',v:true},
{id:'pnl_consol',label:'Консолидация',v:true},
{id:'model',label:'Модель',v:true},
{id:'cf',label:'ДДС',v:true},
{id:'balance',label:'Баланс',v:true},
{id:'payment',label:'Плат.календарь',v:true},
{id:'traffic',label:'Трафик',v:true},
{id:'ckp',label:'ЦКП',v:true},
{id:'results',label:'Результаты',v:true},
{id:'conclusions',label:'Выводы',v:true},
{id:'tech_sheet',label:'Тех.лист',v:true},
];
function buildTabs(){
  const tb=document.getElementById('tabbar'),mn=document.getElementById('main');
  tb.innerHTML=TABS.filter(t=>t.v).map((t,i)=>`<div class="tab${i===0?' active':''}" data-t="${t.id}">${t.label}</div>`).join('');
  mn.innerHTML=TABS.filter(t=>t.v).map((t,i)=>`<div class="pane${i===0?' active':''}" id="p-${t.id}"></div>`).join('');
  tb.addEventListener('click',e=>{if(!e.target.classList.contains('tab'))return;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));e.target.classList.add('active');document.getElementById('p-'+e.target.dataset.t).classList.add('active')});
}

// ===== FORMAT =====
const F={
  $:v=>v>=1e6?'$'+(v/1e6).toFixed(2)+'M':v>=1e3?'$'+(v/1e3).toFixed(0)+'K':'$'+v.toFixed(0),
  pct:v=>v.toFixed(1)+'%',
  n:v=>v.toLocaleString('ru-RU'),
  trend:(c,p,lbl)=>{if(p==null)return{t:'',c:'nt'};const d=((c-p)/Math.abs(p)*100);return{t:(d>=0?'↑':'↓')+Math.abs(d).toFixed(1)+'% к '+lbl,c:d>=0?'up':'dn'}}
};

// ===== DATA STORE =====
let D={
months:['Янв','Фев','Мар','Апр','Май'],
revenue:[885439,930320,868437,867792,741023],
var_costs:[581917,582881,622370,637916,455283],
margin_pct:[34,37,28,26,39],
gross_margin_pct:[33,36,27,25,37],
op_margin_pct:[14,20,8,5,15],
np_margin_pct:[12,15,6,3,12],
op_profit:[127860,183186,72295,41554,108258],
net_profit:[108912,141929,52748,29386,91530],
traffic_cost:[330931,322246,405541,427544,267512],
indirect:[166037,156052,166341,178393,166061],
interest:[21441,22410,22270,22272,20526],
ncf_op:[106824,244010,-1982,64,185468],

let pFrom=0,pTo=4;
function onPeriod(){pFrom=parseInt(document.getElementById('pFrom').value);pTo=parseInt(document.getElementById('pTo').value);if(pTo<pFrom){pTo=pFrom;document.getElementById('pTo').value=pTo}render()}
function sl(a){return(a||[]).slice(pFrom,pTo+1)}

function gm(){return sl(D.months)}
function li(){return pTo}
function pi(){return pTo>0?pTo-1:null}
function plbl(){
  const yr=D.year||2026;
  const janIdx=D.months.findIndex(m=>m==='Янв');
  const yrF=(janIdx>0&&pFrom<janIdx)?yr-1:yr;
  const yrT=(janIdx>0&&pTo<janIdx)?yr-1:yr;
  const mF=D.months[pFrom]||'',mT=D.months[pTo]||'';
  if(pFrom===pTo)return mF+' '+yrF;
  if(yrF===yrT)return mF+'–'+mT+' '+yrT;
  return mF+' '+yrF+'–'+mT+' '+yrT;
}

// Обрабатывает данные от GAS (общая логика для JSONP и fetch)
function applyGASData(d){
  const dot=document.getElementById('live-dot');
  const upd=document.getElementById('updated-at');
  if(!(d&&d.ok)){
    console.warn('Apps Script error:',d&&d.error);
    if(dot)dot.classList.add('offline');
    if(upd)upd.textContent='⚠ ошибка API: '+(d&&d.error||'unknown');
    return;
  }
  const fields=['months','revenue','var_costs','margin_pct','gross_margin_pct','op_margin_pct',
    'np_margin_pct','op_profit','net_profit','traffic_cost','indirect','interest',
    'ncf_op','ncf_inv','ncf_fin','dividends','cash','assets_total','equity','liabilities',
    'lt_debt','st_debt','kz','current_ratio','abs_liquidity','fin_stability','autonomy',
    'de_ratio','roe_monthly','roa_monthly','dfl','rev_core','rev_streams','rev_influence',
    'rev_mannequin','tr_fb','tr_tg','tr_teasers','tr_influence','tr_pp','tr_google',
    'ftd_old','ftd_new','ftd_total','crm_rev','crm_pct'];
  if(d.year)D.year=d.year;
  fields.forEach(f=>{
    if(d[f]&&Array.isArray(d[f])&&d[f].length>0)D[f]=d[f];
  });
  if(d.threshold_rules&&d.threshold_rules.length)D.thresholds=d.threshold_rules;
  if(d.notes&&d.notes.length)D.notes=d.notes;
  if(d.analysis)D.analysis=d.analysis;
  if(d.assumptions)D.assumptions=d.assumptions;
  if(d.pnl_combo)D.pnl_combo=d.pnl_combo;
  if(d.pnl_consol)D.pnl_consol=d.pnl_consol;
  if(d.model_data)D.model_data=d.model_data;
  if(d.payment_data)D.payment_data=d.payment_data;
  if(d.tasks_data)D.tasks_data=d.tasks_data;
  if(d.ckp_data)D.ckp_data=d.ckp_data;
  dataSource='live';
  // Приводим pTo к минимальной длине массивов
  const minLen=Math.min(
    D.months.length,D.revenue.length,D.net_profit.length,D.var_costs.length,
    D.cash.length,D.current_ratio.length,D.abs_liquidity.length,
    D.fin_stability.length,D.de_ratio.length,D.autonomy.length
  );
  pTo=Math.min(D.months.length-1,minLen-1);
  pFrom=Math.min(pFrom,pTo);
  updatePeriodSelectors();
  document.getElementById('pFrom').value=pFrom;
  document.getElementById('pTo').value=pTo;
  localStorage.setItem('rocket_data',JSON.stringify(D));
  localStorage.setItem('rocket_updated',new Date().toISOString());
  if(dot)dot.classList.remove('offline');
  if(upd)upd.textContent='LIVE '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  try{render();}catch(re){console.error('render error after live data:',re);}
}

// JSONP-загрузка: обходит CORS и file:// ограничения браузера
// GAS должен поддерживать параметр ?callback= (возвращает JS, а не JSON)
function fetchViaJSONP(url){
  return new Promise(resolve=>{
    const cbName='__gasCallback_'+Date.now();
    const dot=document.getElementById('live-dot');
    const upd=document.getElementById('updated-at');
    if(upd)upd.textContent='↻ загрузка из Sheets...';
    if(dot)dot.classList.remove('offline');

    let done=false;
    const timer=setTimeout(()=>{
      if(done)return;done=true;
      delete window[cbName];
      if(script.parentNode)script.remove();
      if(upd)upd.textContent='⚠ таймаут (GAS не ответил за 60с)';
      if(dot)dot.classList.add('offline');
      resolve(false);
    },60000);

    window[cbName]=function(d){
      if(done)return;done=true;
      clearTimeout(timer);
      delete window[cbName];
      if(script.parentNode)script.remove();
      applyGASData(d);
      resolve(true);
    };

    const script=document.createElement('script');
    script.src=url+'?action=get_all&callback='+cbName+'&t='+Date.now();
    script.onerror=()=>{
      if(done)return;done=true;
      clearTimeout(timer);
      delete window[cbName];
      if(upd)upd.textContent='⚠ ошибка загрузки GAS (проверь URL деплоя)';
      if(dot)dot.classList.add('offline');
      resolve(false);
    };
    document.head.appendChild(script);
  });
}

async function fetchData(){
  const url=C.DATA_PROXY;

    return;
  }
  // JSONP как основной метод — работает из file://, обходит CORS
  await fetchViaJSONP(url);
}

function updatePeriodSelectors(){
  const FULL={'Янв':'Январь','Фев':'Февраль','Мар':'Март','Апр':'Апрель',

  const yr=D.year||2026;
  // Январь — начало нового года; всё до него — предыдущий год
  const janIdx=D.months.findIndex(m=>m==='Янв');
  ['pFrom','pTo'].forEach(id=>{
    const sel=document.getElementById(id);
    if(!sel)return;
    sel.innerHTML=D.months.map((m,i)=>{
      const y=(janIdx>0&&i<janIdx)?yr-1:yr;
      return`<option value="${i}">${FULL[m]||m} ${y}</option>`;
    }).join('');
  });
  document.getElementById('pFrom').value=pFrom;
  document.getElementById('pTo').value=pTo;
}

  renderResults();renderConclusions();renderTechSheet();
  // Немедленно показываем активный таб (без ожидания IntersectionObserver)
  requestAnimationFrame(()=>{
    document.querySelectorAll('.pane.active [data-reveal]').forEach(el=>el.classList.add('revealed'));
  });
  // IntersectionObserver для неактивных табов
  document.querySelectorAll('[data-reveal]:not(.revealed)').forEach(el=>{
    const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){el.classList.add('revealed');obs.unobserve(el)}})},{threshold:.05});
    obs.observe(el);
  });
  // При переключении таба — раскрыть его элементы
  document.getElementById('tabbar').addEventListener('click',e=>{
    if(!e.target.classList.contains('tab'))return;
    setTimeout(()=>{document.querySelectorAll('.pane.active [data-reveal]:not(.revealed)').forEach(el=>el.classList.add('revealed'))},80);
  },{once:false});
}

// ===== CKP =====
function renderCKP(){
  const el=document.getElementById('p-ckp');
  if(!D.ckp_data||!Array.isArray(D.ckp_data)||D.ckp_data.length<2){
    el.innerHTML=`<div class="asec" data-reveal><h3>📋 ЦКП — Ключевые показатели</h3><p style="color:var(--text-dim);font-size:12px">Данные загружаются из Google Sheets «Дорожная карта 2026». Нажмите «Обновить данные».</p></div>`;
    return;
  }
  const rows=D.ckp_data;
  const hdr=rows[0].map(h=>String(h||'').toLowerCase().trim());
  const iCkp=hdr.findIndex(h=>h.includes('цкп')||h.includes('ckp')||h.includes('проект')||h.includes('группа'));
  const iStat=hdr.findIndex(h=>h.includes('статус')||h.includes('status'));
  // Группируем по ЦКП-колонке или по строкам-заголовкам
  const groups={};const groupOrder=[];
  rows.slice(1).filter(r=>r.some(c=>c!==''&&c!==null&&c!==undefined)).forEach(r=>{
    let ckpKey=iCkp>=0?String(r[iCkp]||'').trim():'';
    // Если нет ЦКП-колонки — ищем строки где первая ячейка содержит "ЦКП"
    if(!ckpKey)ckpKey=String(r[0]||'').trim().match(/цкп\s*\d+/i)?String(r[0]).trim():'ЦКП';
    if(!groups[ckpKey]){groups[ckpKey]=[];groupOrder.push(ckpKey);}
    // Не добавляем строку-заголовок ЦКП, только данные
    const isHeaderRow=String(r[0]||'').trim().match(/^цкп\s*\d+$/i)&&r.slice(1).every(c=>!c||c==='');
    if(!isHeaderRow)groups[ckpKey].push(r);
  });
  let fullHtml='';
  groupOrder.forEach((ckpName,gi)=>{
    const grpRows=groups[ckpName].filter(r=>r.some(c=>c!==''&&c!==null&&c!==undefined));
    if(!grpRows.length)return;
    const cid=`c-ckp-${gi}`;
    const stats={done:0,wip:0,late:0,todo:0};
    grpRows.forEach(r=>{
      const s=String(iStat>=0?r[iStat]:r[r.length-1]||'').toLowerCase();
      if(s.includes('выполн')||s.includes('done')||s.includes('завер')||s.includes('готов'))stats.done++;
      else if(s.includes('работ')||s.includes('wip')||s.includes('прогресс'))stats.wip++;
      else if(s.includes('просроч')||s.includes('late')||s.includes('задерж'))stats.late++;
      else stats.todo++;
    });
    const total=grpRows.length||1;
    const donePct=Math.round(stats.done/total*100);
    // Таблица
    let tbl=`<table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr>`;
    rows[0].forEach((h,ci)=>{if(h!==''&&h!==null&&h!==undefined)tbl+=`<th style="padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.08);color:var(--text-dim);text-align:left;font-weight:500;white-space:nowrap">${h}</th>`;});
    tbl+=`</tr></thead><tbody>`;
    grpRows.forEach(r=>{
      const s=String(iStat>=0?r[iStat]:r[r.length-1]||'').toLowerCase();
      let sc='color:var(--text)';
      if(s.includes('выполн')||s.includes('done'))sc='color:rgba(52,211,153,.9)';
      else if(s.includes('работ')||s.includes('wip'))sc='color:rgba(251,146,60,.9)';
      else if(s.includes('просроч')||s.includes('late'))sc='color:rgba(248,113,113,.9)';
      tbl+=`<tr style="border-bottom:1px solid rgba(255,255,255,.04)">`;
      rows[0].forEach((_,ci)=>{if(rows[0][ci]!==''&&rows[0][ci]!==null&&rows[0][ci]!==undefined)tbl+=`<td style="padding:5px 8px;${ci===iStat?sc:''}">${r[ci]||''}</td>`;});
      tbl+=`</tr>`;
    });
    tbl+=`</tbody></table>`;
    fullHtml+=`<div class="asec" data-reveal style="margin-bottom:20px"><h3>📋 ${ckpName}<span style="font-size:11px;font-weight:400;color:var(--text-dim);margin-left:12px">${donePct}% выполнено · ${grpRows.length} метрик</span></h3><div style="display:grid;grid-template-columns:1fr 180px;gap:16px;align-items:start"><div style="overflow-x:auto">${tbl}</div><div class="card" style="padding:10px"><div style="font-size:10px;color:var(--text-dim);margin-bottom:8px">Статусы</div><div class="cw short"><canvas id="${cid}"></canvas></div></div></div></div>`;
  });
  el.innerHTML=fullHtml||`<div class="asec" data-reveal><h3>📋 ЦКП</h3><p style="color:var(--text-dim);font-size:12px">Нет данных.</p></div>`;
  // Строим диаграммы после вставки HTML в DOM
  groupOrder.forEach((ckpName,gi)=>{
    const grpRows=groups[ckpName];
    const stats={done:0,wip:0,late:0,todo:0};
    grpRows.forEach(r=>{const s=String(iStat>=0?r[iStat]:r[r.length-1]||'').toLowerCase();if(s.includes('выполн')||s.includes('done'))stats.done++;else if(s.includes('работ')||s.includes('wip'))stats.wip++;else if(s.includes('просроч')||s.includes('late'))stats.late++;else stats.todo++;});
    if(Object.values(stats).some(v=>v>0))mc(`c-ckp-${gi}`,{type:'doughnut',data:{labels:['Выполнено','В работе','Просрочено','Не начато'],datasets:[{data:[stats.done,stats.wip,stats.late,stats.todo],backgroundColor:['rgba(52,211,153,.5)','rgba(251,146,60,.5)','rgba(248,113,113,.5)','rgba(100,116,139,.3)'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'60%'}});
  });
}

// ===== TASKS (внутренняя утилита, вызывается из renderResults) =====
function _buildTasksHtml(){
  let html=`<div class="asec" data-reveal><h3>✅ Задачи — Дорожная карта</h3>`;
  if(D.tasks_data&&Array.isArray(D.tasks_data)&&D.tasks_data.length>1){
    const rows=D.tasks_data;
    // Ищем индексы по НАЗВАНИЮ заголовка, а не по позиции (защита от перестановки столбцов)
    const hdr=rows[0].map(h=>String(h||'').toLowerCase().trim());
    const ci=(names)=>{for(const n of names){const i=hdr.findIndex(h=>h.includes(n));if(i>=0)return i;}return-1};
    const iName=ci(['задач','наименов','название','task','name']);
    const iStat=ci(['статус','status','состо']);
    const iOwn=ci(['ответств','owner','исполн','сотрудн']);
    const iDead=ci(['срок','дедлайн','deadline','план']);
    const dataRows=rows.slice(1).filter(r=>r.some(c=>c!==''&&c!==null&&c!==undefined));
    html+=`<div style="margin-bottom:12px">`;
    dataRows.slice(0,50).forEach(r=>{
      const name=(iName>=0?r[iName]:r[0])||'—';
      const rawSt=String(iStat>=0?r[iStat]:r[2]||'').toLowerCase();
      let cls='todo',lbl='Не начато';
      if(rawSt.includes('выполн')||rawSt.includes('done')||rawSt.includes('завер')||rawSt.includes('готов'))cls='done',lbl='Выполнено';
      else if(rawSt.includes('работ')||rawSt.includes('wip')||rawSt.includes('прогресс')||rawSt.includes('в процесс'))cls='wip',lbl='В работе';
      else if(rawSt.includes('просроч')||rawSt.includes('late')||rawSt.includes('задерж')||rawSt.includes('перенос'))cls='late',lbl='Просрочено';
      const owner=iOwn>=0?r[iOwn]:'';
      const dead=iDead>=0?r[iDead]:'';
      html+=`<div class="task-item"><span class="task-status ${cls}">${lbl}</span><span class="pay-name">${name}</span>${owner?`<span style="font-size:10px;color:var(--text-dim);margin-left:8px">${owner}</span>`:''}${dead?`<span style="font-size:10px;color:var(--accent-dim);margin-left:8px">${dead}</span>`:''}</div>`;
    });
    if(dataRows.length>50)html+=`<p style="font-size:10px;color:var(--text-dim);margin-top:8px">...и ещё ${dataRows.length-50} задач</p>`;
    html+=`</div>`;
    // Сводная диаграмма статусов
    const stats={done:0,wip:0,late:0,todo:0};
    dataRows.forEach(r=>{const s=String(iStat>=0?r[iStat]:r[2]||'').toLowerCase();if(s.includes('выполн')||s.includes('done')||s.includes('завер')||s.includes('готов'))stats.done++;else if(s.includes('работ')||s.includes('wip')||s.includes('прогресс'))stats.wip++;else if(s.includes('просроч')||s.includes('late'))stats.late++;else stats.todo++;});
    html+=`</div><div class="card" style="max-width:360px;margin-top:16px" data-reveal><div class="card-title"><span class="dot" style="background:var(--green)"></span>Статусы задач</div><div class="cw short"><canvas id="c-tasks-status"></canvas></div></div>`;
    return {html,stats};
  } else {
    html+=`<p style="color:var(--text-dim);font-size:12px">Источник: Дорожная карта Rocket Project 2026 — лист «свод по задачам».</p>`;
  }
  html+=`</div>`;
  return {html,stats:null};
}

</div>
<div class="asec" data-reveal>
  <h3>2. Кассовый разрыв и дивидендная политика</h3>

  <div class="finding"><span class="finding-num" style="color:var(--red)">🔮</span><strong>Прогноз.</strong><p>Текущий буфер 0.9 дня. Любая задержка выплаты от партнёрских сетей = кассовый разрыв. Вероятность в ближайшие 60 дней: высокая.</p></div>
  <div class="rec urg"><h4>🎯 Решение: Мораторий на дивиденды + кэш-буфер</h4><p>Ограничить дивиденды до 40% ЧП (~$126K вместо $469K). Экономия $343K → формирование буфера 15–20 дней за 2–3 месяца.</p><div class="basis">Правило #11: Кэш < 5 дней → ALERT · Правило #29: Дивиденды/ЧП > 100% → ALERT</div></div>

<div class="asec" data-reveal>

  <div class="finding"><span class="finding-num" style="color:var(--red)">🔮</span><strong>Прогноз.</strong><p>При DFL = −0.44 и дивидендах > ЧП, собственный капитал продолжит сокращаться. Автономия (0.20) приближается к зоне банкротства (< 0.15).</p></div>
  <div class="rec imp"><h4>🎯 Решение: Реструктуризация долга</h4><p>Рефинансировать ≥$500K с 19–30% на ≤12%. Экономия $35–50K/год на процентах, DFL → 0.</p><div class="basis">Правило #23: D/E > 2.5 → ALERT · Правило #20: Автономия < 0.20 → ALERT</div></div>
</div>
<div class="asec" data-reveal>
  <h3>4. Неэффективность FB-канала</h3>

</div>`;

// ===== TECH SHEET =====
function renderTechSheet(){
  const el=document.getElementById('p-tech_sheet');
  if(!el)return;
  // Блок: конфигурация
  const cfgRows=[
    ['GAS Data Proxy',C.DATA_PROXY],
    ['Инструменты',C.TOOLS],
    ['Тайм-менеджмент',C.TM],
    ['Dashboard Config',C.CONFIG_SHEET],
  ];
  let cfgHtml=`<table style="width:100%;border-collapse:collapse;font-size:11px">`;
  cfgRows.forEach(([k,v])=>{
    const isUrl=v&&v.startsWith('http');
    cfgHtml+=`<tr style="border-bottom:1px solid rgba(255,255,255,.05)"><td style="padding:6px 10px;color:var(--text-dim);white-space:nowrap;min-width:180px;width:180px">${k}</td><td style="padding:6px 10px;word-break:break-all">${isUrl?`<a href="${v}" target="_blank" style="color:var(--accent)">${v.length>90?v.substring(0,90)+'…':v} ↗</a>`:v}</td></tr>`;
  });
  cfgHtml+=`</table>`;
  // Блок: состояние данных
  const dataKeys=[['revenue','Выручка'],['net_profit','ЧП'],['cash','Кэш'],['months','Месяцы'],['thresholds','Пороги'],['ckp_data','ЦКП'],['tasks_data','Задачи'],['traffic_data','Трафик'],['errors','Ошибки']];
  let stHtml=`<div class="kpi-row" style="flex-wrap:wrap;gap:10px;margin-top:8px">`;
  dataKeys.forEach(([k,lbl])=>{
    const v=D[k];const ok=Array.isArray(v)?v.length>0:v!==undefined&&v!==null&&v!=='';
    stHtml+=`<div class="kpi" style="min-width:110px;flex:0 0 auto"><div class="kpi-label" style="font-size:9px">${lbl}</div><div class="kpi-val" style="font-size:12px;color:${ok?'var(--green)':'rgba(248,113,113,.8)'}">${ok?'✓':'✗'}</div></div>`;
  });
  stHtml+=`</div>`;
  // Блок: данные config_data (листы Dashboard Config)
  let cfgBlocksHtml='';
  if(D.config_data&&Array.isArray(D.config_data)&&D.config_data.length>0){
    cfgBlocksHtml=`<div class="asec" data-reveal style="margin-top:16px"><h3>📄 Dashboard Config — листы</h3>`;
    D.config_data.forEach(block=>{
      if(!block||!block.sheet)return;
      cfgBlocksHtml+=`<div style="margin-bottom:20px"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">${block.sheet}</div>`;
      if(block.rows&&Array.isArray(block.rows)&&block.rows.length>0){
        cfgBlocksHtml+=`<table style="width:100%;border-collapse:collapse;font-size:10px">`;
        block.rows.forEach((row,ri)=>{
          const isHdr=ri===0;
          cfgBlocksHtml+=`<tr style="border-bottom:1px solid rgba(255,255,255,.04)">`;
          row.forEach(cell=>{
            const val=String(cell||'');const isLink=val.startsWith('http');
            const style=isHdr?'padding:4px 8px;color:var(--text-dim);font-weight:500':'padding:4px 8px';
            cfgBlocksHtml+=`<td style="${style}">${isLink?`<a href="${val}" target="_blank" style="color:var(--accent)">${val.length>55?val.substring(0,55)+'…':val} ↗</a>`:val}</td>`;
          });
          cfgBlocksHtml+=`</tr>`;
        });
        cfgBlocksHtml+=`</table>`;
      }
      cfgBlocksHtml+=`</div>`;
    });
    cfgBlocksHtml+=`</div>`;
  }
  // Блок: ошибки в обратном порядке (новые сверху)
  let errHtml='';
  const errs=Array.isArray(D.errors)&&D.errors.length>0?[...D.errors].reverse():[];
  if(errs.length>0){
    errHtml=`<div class="asec" data-reveal style="margin-top:16px"><h3>⚠️ Ошибки (${errs.length}) — новые сверху</h3>`;
    errs.forEach(e=>{
      const ts=e.timestamp||e.ts||'';const msg=e.message||e.msg||String(e);
      const sev=(e.severity||e.level||'error').toLowerCase();
      const col=sev.includes('warn')?'rgba(251,146,60,.8)':'rgba(248,113,113,.8)';
      errHtml+=`<div style="border-left:2px solid ${col};padding:6px 12px;margin-bottom:6px;font-size:11px">${ts?`<span style="color:var(--text-dim);font-size:10px;margin-right:8px">${ts}</span>`:''}<span style="color:var(--text)">${msg}</span></div>`;
    });
    errHtml+=`</div>`;
  }
  el.innerHTML=`
<div class="asec" data-reveal><h3>⚙️ Конфигурация системы <a href="${C.CONFIG_SHEET}" target="_blank" style="font-size:11px;color:var(--accent);font-weight:400;margin-left:12px">Редактировать Dashboard Config ↗</a></h3>${cfgHtml}</div>
<div class="asec" data-reveal style="margin-top:16px"><h3>🔌 Состояние данных</h3>${stHtml}</div>
${cfgBlocksHtml}
${errHtml||'<div class="asec" data-reveal style="margin-top:16px"><h3>✅ Ошибок нет</h3><p style="color:var(--text-dim);font-size:12px">Все данные загружены без ошибок.</p></div>'}`;
}

// ===== HELPER: RENDER RAW TABLE FROM 2D ARRAY =====
function renderRawTable(data,id){
  if(!data||!data.length)return'';
  const headers=data[0];
  const rows=data.slice(1).filter(r=>r.some(c=>c!==''&&c!==null&&c!==undefined));
  if(!rows.length)return'<p style="color:var(--text-dim);font-size:11px">Нет данных</p>';
  let html=`<div class="raw-table-wrap"><table class="dt" id="${id}"><thead><tr>${headers.map(h=>`<th>${h||''}</th>`).join('')}</tr></thead><tbody>`;
  rows.slice(0,100).forEach(r=>{
    html+=`<tr>${headers.map((_,ci)=>{
      const v=r[ci];
      if(v===null||v===undefined||v==='')return`<td></td>`;
      const n=parseFloat(v);
      if(!isNaN(n)&&v!==''){
        const cls=n<0?'dn':n>0?'':'nt';
        return`<td class="${cls}">${typeof v==='number'?v.toLocaleString('ru-RU'):v}</td>`;
      }
      return`<td>${v}</td>`;
    }).join('')}</tr>`;
  });
  if(rows.length>100)html+=`<tr><td colspan="${headers.length}" style="color:var(--text-dim);text-align:center">...и ещё ${rows.length-100} строк</td></tr>`;
  html+=`</tbody></table></div>`;
  return html;
}
