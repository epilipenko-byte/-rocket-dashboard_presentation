<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #050f05; }
canvas { display: block; width: 100% !important; height: 100% !important; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x040d04);
  scene.fog = new THREE.FogExp2(0x060e06, 0.055);
  const W = window.innerWidth, H = window.innerHeight;
  const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 120);
  camera.position.set(0, 2.2, 10);
  camera.lookAt(0, 0.5, 0);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  function buildBladeGeo() {
    const SEG = 5;
    const pos = [], uv = [], idx = [];
    for (let i = 0; i <= SEG; i++) {
      const t = i / SEG;
      const w = 0.022 * (1.0 - t * 0.88);
      const y = t * 0.72;
      const bx = t * t * 0.08;
      pos.push(-w, y, bx, w, y, bx);
      uv.push(0, t, 1, t);
    }
    for (let i = 0; i < SEG; i++) {
      const b = i * 2;
      idx.push(b, b+2, b+1, b+1, b+2, b+3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    return geo;
  }
  const grassMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0.0 } },
    vertexShader: `uniform float uTime; varying vec2 vUv; void main() { vUv = uv; float h = uv.y; vec3 wp = vec3(instanceMatrix[3][0], 0.0, instanceMatrix[3][2]); float phase = wp.x * 0.63 + wp.z * 0.47 + wp.x * wp.z * 0.011; float wind = sin(uTime * 1.35 + phase) * 0.55 + sin(uTime * 0.71 + phase * 1.4) * 0.22 + sin(uTime * 2.30 + phase * 0.6) * 0.08; float sway = wind * h * h * 0.32; float swayZ = cos(uTime * 1.05 + phase * 0.9) * h * h * 0.10; vec3 p = position; p.x += sway; p.z += swayZ; gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(p, 1.0); }`,
    fragmentShader: `varying vec2 vUv; void main() { vec3 root = vec3(0.035, 0.105, 0.025); vec3 mid = vec3(0.075, 0.230, 0.055); vec3 tip = vec3(0.135, 0.400, 0.080); vec3 col = vUv.y < 0.5 ? mix(root, mid, vUv.y * 2.0) : mix(mid, tip, (vUv.y - 0.5) * 2.0); float edge = 1.0 - abs(vUv.x - 0.5) * 0.85; col *= (0.6 + edge * 0.4); float alpha = 1.0 - smoothstep(0.72, 1.0, vUv.y) * 0.55; col *= (0.82 + vUv.y * 0.18); gl_FragColor = vec4(col, alpha); }`,
    side: THREE.DoubleSide, transparent: true, depthWrite: false,
  });
  const COUNT = 110000;
  const mesh = new THREE.InstancedMesh(buildBladeGeo(), grassMat, COUNT);
  mesh.frustumCulled = false;
  scene.add(mesh);
  const dummy = new THREE.Object3D();
  const SPREAD = 22;
  for (let i = 0; i < COUNT; i++) {
    const r = Math.sqrt(Math.random()) * SPREAD;
    const ang = Math.random() * Math.PI * 2;
    const x = Math.cos(ang) * r;
    const z = Math.sin(ang) * r * 0.55 + 3;
    dummy.position.set(x, 0, z);
    dummy.rotation.y = Math.random() * Math.PI * 2;
    dummy.rotation.z = (Math.random() - 0.5) * 0.18;
    const s = 0.75 + Math.random() * 0.95;
    const sh = 0.8 + Math.random() * 0.7;
    dummy.scale.set(s, sh, s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  const groundMat = new THREE.MeshBasicMaterial({ color: 0x080e06 });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.01;
  scene.add(ground);
  const glowGeo = new THREE.PlaneGeometry(60, 8);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x062206, transparent: true, opacity: 0.45, side: THREE.DoubleSide });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.rotation.x = -Math.PI / 2;
  glow.position.set(0, 0.005, -5);
  scene.add(glow);
  const clock = new THREE.Clock();
  (function animate() { requestAnimationFrame(animate); grassMat.uniforms.uTime.value = clock.getElapsedTime(); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
